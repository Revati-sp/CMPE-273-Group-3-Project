# Customer WebSockets. Any replica serves any conversation: state is in Redis (session snapshot,
# cursor), Kafka (chat.session-state) and PostgreSQL (the message log). On shutdown the preStop
# hook drains the pod (readiness fails), then SIGTERM sends server_draining and closes sockets
# with 1012; clients reconnect to another replica, which claims the session and replays.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  labels: &id001
    app.kubernetes.io/name: chat-service
    app.kubernetes.io/component: chat
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: *id001
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: engagehub-workload
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: chat-service
      containers:
      - name: chat-service
        image: engagehub/chat-service
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: engagehub-config
        - configMapRef:
            name: chat-service-config
        - secretRef:
            name: engagehub-secrets
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SERVICE_NAME
          value: chat-service
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: engagehub-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: engagehub-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: engagehub-config
              key: POSTGRES_HOST
        - name: DATABASE_URL
          value: postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/eh_chat
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 384Mi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - python -c "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/internal/drain',
                method='POST'), timeout=2)" ; sleep 8
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
