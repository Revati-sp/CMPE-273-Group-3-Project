  newName: registry.example.com/engagehub/session-service
  newTag: 1.0.0
- name: engagehub/audit-service
  newName: registry.example.com/engagehub/audit-service
  newTag: 1.0.0
patches:
- path: ingress-tls-patch.yaml
- path: config-patch.yaml
resources:
- ../keda
