# Replace chat.example.com. cert-manager issues the certificate into engagehub-tls.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: engagehub
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
  - hosts:
    - chat.example.com
    secretName: engagehub-tls
  rules:
  - host: chat.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              name: http
