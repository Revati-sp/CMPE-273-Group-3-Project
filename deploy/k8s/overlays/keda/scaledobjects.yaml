# Kafka-lag autoscaling for the virtual agents (KEDA 2.x must be installed).
# KEDA reads the consumer group's real lag on its task topic: about one replica per 20
# pending tasks, between 2 and 10. Replicas beyond the topic's partition count would be
# idle (allowIdleConsumers: false caps them), so agent topics have 12 partitions.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: va-product-advisor
spec:
  scaleTargetRef:
    name: va-product-advisor
  minReplicaCount: 2
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 120
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Pods
            value: 1
            periodSeconds: 120
  triggers:
  - type: kafka
    metadata:
      bootstrapServersFromEnv: KAFKA_BOOTSTRAP_SERVERS
      consumerGroup: va-product_advisor
      topic: chat.agent-tasks.product_advisor
      lagThreshold: '20'
      activationLagThreshold: '5'
      offsetResetPolicy: earliest
      allowIdleConsumers: 'false'
  - type: cpu
    metricType: Utilization
    metadata:
      value: '70'
---
